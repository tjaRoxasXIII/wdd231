<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="The Explore page for The Game Database project, allowing users to discover new games by submitting search parameters.">
    <meta name="author" content="Taylor Allen">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Discover New Games — The Game Database">
    <meta property="og:description" content="Find your next favorite game with The Game Database's explore feature by browsing or searching directly from Steam.">
    <meta property="og:image" content="images/hero-wide.webp">
    <meta property="og:url" content="https://tjaroxasxiii.github.io/wdd231/finalproject/explore.html">
    <title>The Game Database - Explore</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@300&family=Nunito&family=Orbitron:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="../scripts/getdates.js" defer></script>
    <script type="module" src="scripts/explore.js"></script>
    <script src="scripts/menu.js" defer></script>
</head>
<body>
    <header>
        <nav>
        <h1>The Game Database</h1>
            <button id="menu" title="Menu Toggle" class="open">☰</button>
            <ul class="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="library.html">Game Library</a></li>
                <li><a href="explore.html" aria-current="page" class="active">Explore</a></li>
            </ul>
        </nav>

    </header>
    <main>
        <h2>Find Your Next Adventure</h2>
        <input type="text" id="search" placeholder="Search games...">
        <button id="search-button">Search</button>

        <div id="spinner" class="hidden">Loading...</div>
        <button id="show-more" class="hidden">Show More</button>

        <div id="game-list"></div>

        <dialog id="game-modal">
            <div id="modal-content">
                <button id="close-modal">X</button>
                <h2 id="modal-title"></h2>
                <p id="modal-summary"></p>
                <p id="modal-about"></p>
                <p id="modal-pc-req"></p>
                <p id="modal-release"></p>
                <p id="modal-categories"></p>
                <p id="modal-genres"></p>
            </div>
        </dialog>

    </main>
    <footer>
        <span class="socials">
            <a href="https://github.com/tjaroxasxiii"><img src="../images/github.svg" alt="GitHub Logo" width="40"></a>
            <a href="https://linkedin.com/taylor-jay-allen"><img src="../images/linkedin.svg" alt="LinkedIn Logo" width="40"></a>
            <a href="https://x.com/taylorjayallen1"><img src="../images/twitter-alt-circle.svg" alt="X/Twitter Logo" width="40"></a>
        </span>
        <p>&copy; <span id="currentyear"></span> - Taylor Allen - Florida</p>
        <p id="lastModified"></p>
    </footer>
    
</body>
</html>
