    <meta property="og:url" content="https://tjaroxasxiii.github.io/wdd231/finalproject/library.html">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <header>
        <nav>
        <h1>The Game Database</h1>
            <button id="menu" title="Menu Toggle" class="open">☰</button>
            <ul class="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="library.html" aria-current="page" class="active">Game Library</a></li>
                <li><a href="explore.html">Explore</a></li>
            </ul>
        </nav>

    </header>
    <main>
        <h2>My Steam Library</h2>
        <h3 id="lifetime-hours">Total Lifetime Hours Played: 0</h3>
        <input type="text" id="search" placeholder="Search games...">
        <select id="sorting-options">
            <option value="">Sort by:</option>
            <option value="name">Name - (A/Z)</option>
            <option value="name-desc">Name - (Z/A)</option>
            <option value="hours">Hours Played</option>
        </select>
        <button id="clear-ratings">Clear All Ratings</button>
        <div id="game-list"></div>
    </main>
    <footer>
